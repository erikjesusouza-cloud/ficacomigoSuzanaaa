<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Suzana ❤️</title>
    <!-- Biblioteca de Confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffe6e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .container {
            background-color: #ffffff;
            padding: 35px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 380px;
            width: 90%;
            position: relative;
        }

        h1 {
            color: #d63384;
            font-size: 22px;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .botoes {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            min-height: 50px;
            margin-top: 15px;
        }

        button, .btn-whatsapp {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
            display: inline-block;
            text-decoration: none;
        }

        #btnSim {
            background-color: #28a745;
            color: white;
            transition: transform 0.2s;
        }

        #btnSim:active {
            transform: scale(0.95);
        }

        #btnNao {
            background-color: #dc3545;
            color: white;
            position: static;
            z-index: 999;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: white;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
            transition: transform 0.2s;
        }

        /* --- ESTILOS DO CARROSSEL DE FOTOS --- */
        .carrossel {
            position: relative;
            width: 100%;
            height: 220px;
            margin: 15px 0;
            overflow: hidden;
            border-radius: 15px;
            display: none; /* Inicia escondido */
        }

        .carrossel img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 15px;
            display: none;
        }

        .carrossel img.ativa {
            display: block;
        }

        .btn-carrossel {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.4);
            color: white;
            border: none;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 50%;
            font-size: 16px;
        }

        .btn-prev { left: 10px; }
        .btn-next { right: 10px; }
    </style>
</head>
<body>

    <div class="container" id="card">
        <h1 id="titulo">Suzana, aceita sair comigo? ❤️</h1>
        
        <!-- O ONDE FICA O CARROSSEL -->
        <div class="carrossel" id="carrosselFotos">
            <!-- COLOQUE OS LINKS DAS SUAS FOTOS AQUI ABAIXO -->
            <img src="https://picsum.photos/400/300?random=1" class="ativa" alt="Foto 1">
            <img src="https://picsum.photos/400/300?random=2" alt="Foto 2">
            <img src="https://picsum.photos/400/300?random=3" alt="Foto 3">
            
            <button class="btn-carrossel btn-prev" onclick="mudarFoto(-1)">❮</button>
            <button class="btn-carrossel btn-next" onclick="mudarFoto(1)">❯</button>
        </div>

        <div class="botoes">
            <button id="btnSim" onclick="proximaPergunta()">Sim</button>
            <button id="btnNao">Não</button>
        </div>
    </div>

    <script>
        const meuNumeroWhatsApp = "5599991681041";
        const btnNao = document.getElementById('btnNao');

        function fugirBotao(e) {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }

            const larguraMax = window.innerWidth - btnNao.offsetWidth - 30;
            const alturaMax = window.innerHeight - btnNao.offsetHeight - 30;

            const novaEsquerda = Math.max(20, Math.floor(Math.random() * larguraMax));
            const novoTopo = Math.max(20, Math.floor(Math.random() * alturaMax));

            btnNao.style.position = 'fixed';
            btnNao.style.left = novaEsquerda + 'px';
            btnNao.style.top = novoTopo + 'px';

            return false;
        }

        btnNao.addEventListener('touchstart', fugirBotao, { passive: false });
        btnNao.addEventListener('touchend', fugirBotao, { passive: false });
        btnNao.addEventListener('mousedown', fugirBotao);
        btnNao.addEventListener('mouseover', fugirBotao);
        btnNao.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            fugirBotao(e);
        });

        function soltarConfetes() {
            confetti({
                particleCount: 120,
                spread: 80,
                origin: { y: 0.6 }
            });
        }

        // LÓGICA DO CARROSSEL
        let fotoAtual = 0;
        function mudarFoto(direcao) {
            const fotos = document.querySelectorAll('.carrossel img');
            fotos[fotoAtual].classList.remove('ativa');
            
            fotoAtual = (fotoAtual + direcao + fotos.length) % fotos.length;
            fotos[fotoAtual].classList.add('ativa');
        }

        function proximaPergunta() {
            btnNao.style.display = 'none';
            soltarConfetes();

            // EXIBE O CARROSSEL DE FOTOS
            document.getElementById('carrosselFotos').style.display = 'block';

            const titulo = document.getElementById('titulo');
            titulo.innerHTML = 'Sabia que você ia aceitar, Suzana! 🎉<br>Nossas lembranças:';

            const btnSim = document.getElementById('btnSim');
            btnSim.innerText = 'Continuar 🔥';
            btnSim.onclick = respostaFinal;
        }

        function respostaFinal() {
            soltarConfetes();
            
            const mensagem = encodeURIComponent("me leva pra onde quiser, vida");
            const linkWhatsapp = `https://wa.me/${meuNumeroWhatsApp}?text=${mensagem}`;

            const card = document.getElementById('card');
            card.innerHTML = `
                <h1 style="color: #d63384;">Perfeito, Suzana! ❤️</h1>
                <p style="font-size: 16px; color: #555; margin-top: 15px;">Clique no botão abaixo para me avisar:</p>
                <a href="${linkWhatsapp}" class="btn-whatsapp" target="_blank">Enviar no WhatsApp 💬</a>
            `;
        }
    </script>

</body>
</html>
